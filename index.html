<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台灣省道測速照相取締地圖 (OpenStreetMap)</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#0f172a'
            }
          }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <!-- PapaParse for local CSV parsing -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    #map {
      height: 100%;
      width: 100%;
      z-index: 10;
    }
    .custom-cam-pin {
      width: 32px;
      height: 32px;
      background: #dc2626;
      border: 2.5px solid #ffffff;
      border-radius: 9999px;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
      transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .custom-cam-pin:hover {
      transform: scale(1.22);
      background: #b91c1c;
    }
    .custom-cam-pin i {
      font-size: 14px;
    }
    /* MarkerCluster Theme Tweaks */
    .marker-cluster-small {
      background-color: rgba(239, 68, 68, 0.3) !important;
    }
    .marker-cluster-small div {
      background-color: rgba(220, 38, 38, 0.85) !important;
      color: #ffffff !important;
      font-weight: 700;
    }
    .marker-cluster-medium {
      background-color: rgba(217, 119, 6, 0.3) !important;
    }
    .marker-cluster-medium div {
      background-color: rgba(217, 119, 6, 0.85) !important;
      color: #ffffff !important;
      font-weight: 700;
    }
    .marker-cluster-large {
      background-color: rgba(37, 99, 235, 0.3) !important;
    }
    .marker-cluster-large div {
      background-color: rgba(29, 78, 216, 0.85) !important;
      color: #ffffff !important;
      font-weight: 700;
    }
    /* Leaflet popup overrides */
    .leaflet-popup-content-wrapper {
      padding: 0;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 12px 30px -4px rgba(0, 0, 0, 0.25);
    }
    .leaflet-popup-content {
      margin: 0;
      width: 340px !important;
      max-width: 90vw !important;
    }
  </style>
</head>

<body class="bg-slate-900 text-slate-800 h-screen w-screen flex flex-col">

  <header class="bg-slate-900 text-white px-4 py-3 border-b border-slate-800 flex items-center justify-between z-30 shrink-0 shadow-lg">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-red-500/10 border border-red-500/30 flex items-center justify-center text-red-400 shrink-0">
        <i class="fa-solid fa-camera text-lg"></i>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-base sm:text-lg font-bold tracking-tight">全台省道測速照相取締地圖</h1>
          <span class="text-[11px] font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-full">
            OpenStreetMap 底圖
          </span>
        </div>
        <p class="text-xs text-slate-400 hidden sm:block">交通部公路局警52標誌圖資 · 嚴格保持原資料欄位完整度</p>
      </div>
    </div>

    <div class="flex items-center gap-2 sm:gap-3">
      <!-- File input button -->
      <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-semibold py-1.5 px-3 rounded-lg flex items-center gap-2 transition duration-150">
        <i class="fa-solid fa-folder-open text-sky-400"></i>
        <span class="hidden md:inline">載入原始 CSV 檔</span>
        <span class="md:hidden">載入CSV</span>
        <input type="file" id="csvFileInput" accept=".csv" class="hidden" />
      </label>

      <!-- Sidebar toggle button -->
      <button id="toggleSidebarBtn" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold py-1.5 px-3 rounded-lg flex items-center gap-1.5 transition duration-150 shadow-sm">
        <i class="fa-solid fa-bars-staggered"></i>
        <span class="hidden sm:inline">側邊欄</span>
      </button>
    </div>
  </header>

  <div class="relative flex-1 flex overflow-hidden">
    <!-- LEFT SIDEBAR -->
    <aside id="sidebar" class="w-full sm:w-96 md:w-[420px] bg-slate-50 border-r border-slate-200 flex flex-col shrink-0 z-20 transition-all duration-300 ease-in-out absolute md:relative h-full shadow-2xl md:shadow-none">
      
      <!-- Filters header panel -->
      <div class="p-4 bg-white border-b border-slate-200 space-y-3">
        <!-- Keyword Search -->
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
          <input
            type="text"
            id="searchInput"
            placeholder="搜尋公路 (例如: 台1)、縣市、鄉鎮、樁號..."
            class="w-full pl-8 pr-8 py-2 text-xs bg-slate-100 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition"
          />
          <button id="clearSearchBtn" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
            <i class="fa-solid fa-circle-xmark text-xs"></i>
          </button>
        </div>

        <!-- County & Highway Dropdown -->
        <div class="grid grid-cols-2 gap-2 text-xs">
          <div>
            <label class="block text-slate-500 font-medium mb-1">隸屬縣市</label>
            <select id="countyFilter" class="w-full bg-slate-100 border border-slate-200 rounded-lg p-2 focus:ring-1 focus:ring-blue-500 focus:outline-none text-slate-700">
              <option value="">全部縣市</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-500 font-medium mb-1">公路編號</label>
            <select id="routeFilter" class="w-full bg-slate-100 border border-slate-200 rounded-lg p-2 focus:ring-1 focus:ring-blue-500 focus:outline-none text-slate-700">
              <option value="">全部路線</option>
            </select>
          </div>
        </div>

        <!-- Direction & Reset Filter -->
        <div class="grid grid-cols-2 gap-2 text-xs">
          <div>
            <label class="block text-slate-500 font-medium mb-1">牌面方向</label>
            <select id="directionFilter" class="w-full bg-slate-100 border border-slate-200 rounded-lg p-2 focus:ring-1 focus:ring-blue-500 focus:outline-none text-slate-700">
              <option value="">全方向</option>
              <option value="順向">順向</option>
              <option value="逆向">逆向</option>
              <option value="雙向">雙向</option>
            </select>
          </div>
          <div class="flex items-end">
            <button id="resetFiltersBtn" class="w-full py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg font-medium transition flex items-center justify-center gap-1.5">
              <i class="fa-solid fa-rotate-left"></i>
              <span>重設條件</span>
            </button>
          </div>
        </div>

        <!-- Stats Counter -->
        <div class="flex items-center justify-between text-xs pt-1 border-t border-slate-100 text-slate-500">
          <div>
            顯示 <span id="filteredCount" class="font-bold text-blue-600">0</span> / 總計 <span id="totalCount" class="font-medium text-slate-700">0</span> 處
          </div>
          <div id="dataStatusIndicator" class="flex items-center gap-1.5 text-emerald-600 font-medium">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span id="dataStatusText">預設示範圖資</span>
          </div>
        </div>
      </div>

      <!-- Point Cards List Container -->
      <div id="cardsContainer" class="flex-1 overflow-y-auto p-3 space-y-2.5">
        <!-- Rendered via JS -->
      </div>

      <div class="p-2.5 bg-slate-100 border-t border-slate-200 text-[11px] text-slate-500 text-center">
        💡 點選清單項目會自動平滑移動並展開聚合標記
      </div>
    </aside>

    <main class="flex-1 relative h-full">
      <div id="map"></div>

      <!-- Floating Map Quick Tools -->
      <div class="absolute bottom-6 right-6 z-[1000] flex flex-col space-y-2">
        <button id="locateMeBtn" title="定位我的位置" class="bg-white hover:bg-slate-50 text-slate-700 w-10 h-10 rounded-xl shadow-lg border border-slate-200 flex items-center justify-center transition">
          <i class="fa-solid fa-location-crosshairs text-blue-600"></i>
        </button>
        <button id="fitAllBtn" title="回全台視野" class="bg-white hover:bg-slate-50 text-slate-700 w-10 h-10 rounded-xl shadow-lg border border-slate-200 flex items-center justify-center transition">
          <i class="fa-solid fa-earth-asia text-blue-600"></i>
        </button>
      </div>

      <!-- Loading Spinner Modal -->
      <div id="loadingOverlay" class="absolute inset-0 bg-slate-900/40 backdrop-blur-[2px] z-[2000] flex flex-col items-center justify-center text-white hidden">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-2xl flex flex-col items-center">
          <div class="w-10 h-10 border-4 border-blue-400 border-t-transparent rounded-full animate-spin mb-3"></div>
          <p id="loadingMessage" class="text-xs font-semibold tracking-wide">資料讀取與坐標投影分析中...</p>
        </div>
      </div>
    </main>
  </div>

    function showLoading(msg = '處理中...') {
      const overlay = document.getElementById('loadingOverlay');

    function hideLoading() {

      overlay.classList.add('hidden');
    }

    function extractCoordinates(row) {
      let lat = null;
      let lng = null;

      // 嚴格對照公路局 WGS84 欄位
      if (row['坐標-N-WGS84'] && row['坐標-E-WGS84']) {
        lat = parseFloat(row['坐標-N-WGS84']);
        lng = parseFloat(row['坐標-E-WGS84']);
      } else if (row['緯度'] && row['經度']) {
        lat = parseFloat(row['緯度']);
        lng = parseFloat(row['經度']);
      } else if (row['Lat'] && row['Lng']) {
        lat = parseFloat(row['Lat']);
        lng = parseFloat(row['Lng']);
      } else {
        // Fallback 尋找可能含座標的欄位名稱
        for (let k in row) {
          const lk = k.toLowerCase();
          if ((lk.includes('lat') || k.includes('緯')) && !lat) {
            const v = parseFloat(row[k]);
            if (!isNaN(v)) lat = v;
          }
          if ((lk.includes('lng') || lk.includes('lon') || k.includes('經')) && !lng) {
            const v = parseFloat(row[k]);
            if (!isNaN(v)) lng = v;
          }
        }
      }

      // 台灣座標防呆驗證 (Lat 21~26.5, Lng 118~123)
      if (lat && lng && !isNaN(lat) && !isNaN(lng)) {
        if (lat > 118 && lat < 123 && lng > 21 && lng < 26.5) {
          const tmp = lat;
          lat = lng;
          lng = tmp;
        }
        if (lat >= 21.0 && lat <= 26.5 && lng >= 118.0 && lng <= 123.0) {
          return { lat, lng, valid: true };
        }
      }
      return { lat, lng, valid: false };
    }

    function initMap() {
      // 預設中心點置於台灣本島 (23.9738, 120.9820)，縮放等級 8
      state.map = L.map('map', {
        center: [23.9738, 120.9820],
        zoom: 8,
        zoomControl: false
      });

      // 指定使用 OpenStreetMap 官方瓦片圖資
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'
      }).addTo(state.map);

      // 右下角縮放控制器
      L.control.zoom({ position: 'bottomright' }).addTo(state.map);

      // 建立 MarkerClusterGroup
      state.markerClusterGroup = L.markerClusterGroup({
        chunkedLoading: true,
        maxClusterRadius: 45,
        spiderfyOnMaxZoom: true,
        showCoverageOnHover: false,
        zoomToBoundsOnClick: true
      });
      state.map.addLayer(state.markerClusterGroup);
    }

    function buildPopupHtml(item, index) {
      let rowsHtml = '';
      const prioritizedKeys = [
        '公路編號', '起點樁號', '牌面方向', '牌面內容',
        '隸屬縣市', '隸屬鄉鎮', '隸屬村里', '管養單位',
        '管養工務段', '調查日期', '種類', '性質',
        '設置位置', '編號', '現況', '是否為公路局設置',
        '坐標-E-WGS84', '坐標-N-WGS84', '坐標-X-TWD97', '坐標-Y-TWD97',
        '坐標Z', '備註'
      ];
      const renderedSet = new Set();

      prioritizedKeys.forEach(k => {
        if (item[k] !== undefined && item[k] !== null && String(item[k]).trim() !== '') {
          rowsHtml += `
            <tr class="border-b border-slate-100 hover:bg-slate-50">
              <td class="py-1 px-3 text-[11px] font-semibold text-slate-500 bg-slate-50 whitespace-nowrap">${k}</td>
              <td class="py-1 px-3 text-[11px] text-slate-800 break-words font-mono">${item[k]}</td>
            </tr>
          `;
          renderedSet.add(k);
        }
      });

      // 渲染任何其他存在於原始 CSV 的非預設欄位 (100% 忠實呈現，絕不刪漏)
      Object.keys(item).forEach(k => {
        if (!renderedSet.has(k) && k !== '_internal_id' && k !== '_coords') {
          rowsHtml += `
            <tr class="border-b border-slate-100 hover:bg-slate-50">
              <td class="py-1 px-3 text-[11px] font-medium text-slate-400 bg-slate-50/70 whitespace-nowrap">${k}</td>
              <td class="py-1 px-3 text-[11px] text-slate-700 break-words">${item[k] !== undefined ? item[k] : ''}</td>
            </tr>
          `;
        }
      });

      const road = item['公路編號'] || '省道';
      const stake = item['起點樁號'] || '';
      const county = item['隸屬縣市'] || '';
      const town = item['隸屬鄉鎮'] || '';
      const dir = item['牌面方向'] || '';

      return `
        <div class="text-slate-800 bg-white">
          <div class="bg-gradient-to-r from-blue-900 to-slate-900 text-white p-3.5 border-b border-slate-700">
            <div class="flex items-center justify-between">
              <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-bold bg-amber-400 text-slate-950 shadow-sm">
                <i class="fa-solid fa-triangle-exclamation mr-1 text-[11px]"></i> ${road}
              </span>
              <span class="text-xs text-sky-200 font-mono font-semibold">${stake}</span>
            </div>
            <div class="flex items-center justify-between mt-2">
              <h4 class="font-bold text-sm text-white">${county} ${town} 取締標誌</h4>
              ${dir ? `<span class="text-[11px] px-2 py-0.5 bg-red-500/80 text-white rounded font-medium">${dir}</span>` : ''}
            </div>
          </div>

          <div class="max-h-64 overflow-y-auto">
            <table class="w-full text-left border-collapse">
              <tbody>
                ${rowsHtml}
              </tbody>
            </table>
          </div>

          <div class="p-2.5 bg-slate-50 border-t border-slate-200 flex items-center justify-between text-[11px]">
            <span class="text-slate-400 font-mono">序號 #${index + 1}</span>
            <button onclick="zoomToRecord(${item._internal_id})" class="text-blue-600 hover:text-blue-800 font-bold flex items-center gap-1 transition">
              <i class="fa-solid fa-crosshairs"></i> 置中顯示
            </button>
          </div>
        </div>
      `;
    }

    function renderMarkers() {
      state.markerClusterGroup.clearLayers();
      state.markerMap.clear();

      state.filteredRecords.forEach((item) => {
        if (!item._coords || !item._coords.valid) return;

        const icon = L.divIcon({
          className: 'leaflet-data-marker',
          html: `<div class="custom-cam-pin"><i class="fa-solid fa-camera"></i></div>`,
          iconSize: [32, 32],
          iconAnchor: [16, 16],
          popupAnchor: [0, -16]
        });

        const marker = L.marker([item._coords.lat, item._coords.lng], { icon: icon });
        const popupHtml = buildPopupHtml(item, item._internal_id);
        marker.bindPopup(popupHtml, { maxWidth: 360 });

        state.markerMap.set(item._internal_id, marker);
        state.markerClusterGroup.addLayer(marker);
      });
    }

              <span class="text-xs font-semibold text-blue-700 bg-blue-50 px-2 py-0.5 rounded border border-blue-100">
                ${stake}
              </span>
            </div>

            <div class="text-sm font-bold text-slate-800 flex items-center gap-1.5">
              <i class="fa-solid fa-location-dot text-rose-500 text-xs"></i>
              <span>${county} ${town}</span>
              ${village ? `<span class="text-slate-400 font-normal text-xs">(${village})</span>` : ''}
            </div>

            <div class="mt-2 text-xs text-slate-500 flex flex-wrap gap-x-3 gap-y-1">
              <div><span class="text-slate-400">方向:</span> <span class="text-slate-700 font-medium">${dir}</span></div>
              ${item['管養工務段'] ? `<div><span class="text-slate-400">工務段:</span> ${item['管養工務段']}</div>` : ''}
              ${item['編號'] ? `<div><span class="text-slate-400">編號:</span> <span class="font-mono">${item['編號']}</span></div>` : ''}
            </div>

            ${item['牌面內容'] ? `
              <div class="mt-2 pt-1.5 border-t border-slate-100 text-[11px] text-slate-500 truncate">
                <i class="fa-solid fa-circle-info text-blue-400 mr-1"></i>${item['牌面內容']}
              </div>
            ` : ''}
          </div>
        `;
      });

      if (state.filteredRecords.length > 150) {
        cardsHtml += `
          <div class="text-center py-2 text-xs text-slate-400 bg-slate-100 rounded-lg">
            已載入前 150 筆清單（地圖已完整顯示全部 ${state.filteredRecords.length} 處點位）
          </div>
        `;
      }

      container.innerHTML = cardsHtml;
    }

    window.selectAndFocus = function(internalId) {
      state.selectedItemIndex = internalId;
      renderCards();
      zoomToRecord(internalId);

      if (window.innerWidth < 768) {
        toggleSidebar(false);
      }
    };

    window.zoomToRecord = function(internalId) {
      const marker = state.markerMap.get(internalId);
      if (!marker) return;

      const latlng = marker.getLatLng();
      state.markerClusterGroup.zoomToShowLayer(marker, () => {
        state.map.flyTo(latlng, 16, { animate: true, duration: 1.0 });
        marker.openPopup();
      });
    };

    function applyFilters() {
      const kw = document.getElementById('searchInput').value.trim().toLowerCase();
      const county = document.getElementById('countyFilter').value;
      const route = document.getElementById('routeFilter').value;
      const direction = document.getElementById('directionFilter').value;

      state.filteredRecords = state.allRecords.filter((item) => {
        if (county && item['隸屬縣市'] !== county) return false;
        if (route && item['公路編號'] !== route) return false;
        if (direction) {
          const d = String(item['牌面方向'] || '');
          if (!d.includes(direction)) return false;
        }

        if (kw) {
          const matchTargets = [
            item['公路編號'],
            item['起點樁號'],
            item['隸屬縣市'],
            item['隸屬鄉鎮'],
            item['隸屬村里'],
            item['編號'],
            item['管養工務段'],
            item['管養單位'],
            item['牌面內容'],
            item['備註']
          ].filter(Boolean).map(v => String(v).toLowerCase());

          if (!matchTargets.some(target => target.includes(kw))) {
            return false;
          }
        }
        return true;
      });

      renderMarkers();
      renderCards();
    }

    function populateFilterDropdowns() {
      const countySelect = document.getElementById('countyFilter');
      const routeSelect = document.getElementById('routeFilter');

      const counties = new Set();
      const routes = new Set();

      state.allRecords.forEach(item => {
        if (item['隸屬縣市']) counties.add(item['隸屬縣市'].trim());
        if (item['公路編號']) routes.add(item['公路編號'].trim());
      });

      const sortedCounties = Array.from(counties).sort((a, b) => a.localeCompare(b, 'zh-Hant'));
      countySelect.innerHTML = '<option value="">全部縣市</option>';
      sortedCounties.forEach(c => {
        countySelect.innerHTML += `<option value="${c}">${c}</option>`;
      });

      const sortedRoutes = Array.from(routes).sort((a, b) => a.localeCompare(b, 'zh-Hant', { numeric: true }));
      routeSelect.innerHTML = '<option value="">全部路線</option>';
      sortedRoutes.forEach(r => {
        routeSelect.innerHTML += `<option value="${r}">${r}</option>`;
      });
    }

    function processRawDataset(records) {
      showLoading('解析圖資點位與空間座標...');

      const validList = [];
      records.forEach((row, idx) => {
        if (!row || Object.keys(row).length === 0) return;
        const coords = extractCoordinates(row);
        validList.push({
          ...row,
          _internal_id: idx,
          _coords: coords
        });
      });

      state.allRecords = validList;
      state.filteredRecords = [...validList];

      document.getElementById('totalCount').innerText = validList.length.toLocaleString();

      populateFilterDropdowns();
      renderMarkers();
      renderCards();

      if (state.markerClusterGroup.getLayers().length > 0) {
        state.map.fitBounds(state.markerClusterGroup.getBounds().pad(0.08));
      }

      hideLoading();
    }

    function handleCsvFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;

      showLoading('讀取上傳之 CSV 圖資...');

      Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        encoding: 'UTF-8',
        complete: function(results) {
          if (results.data && results.data.length > 0) {
            processRawDataset(results.data);
            const statusText = document.getElementById('dataStatusText');
            statusText.innerText = `已載入: ${file.name}`;
          } else {
            alert('CSV 內容為空或無法解析。');
            hideLoading();
          }
        },
        error: function(err) {
          console.error(err);
          alert('CSV 載入失敗: ' + err.message);
          hideLoading();
        }
      });
    }

    function toggleSidebar(forceState) {
      const sidebar = document.getElementById('sidebar');
      if (typeof forceState === 'boolean') {
        state.sidebarOpen = forceState;
      } else {
        state.sidebarOpen = !state.sidebarOpen;
      }

      if (state.sidebarOpen) {
        sidebar.classList.remove('-translate-x-full');
      } else {
        sidebar.classList.add('-translate-x-full');
      }

      setTimeout(() => {
        state.map.invalidateSize();
      }, 310);
    }

    function setupEventListeners() {
      // Local CSV Upload
      document.getElementById('csvFileInput').addEventListener('change', handleCsvFileSelect);

      // Sidebar Toggle
      document.getElementById('toggleSidebarBtn').addEventListener('click', () => toggleSidebar());

      // Search Inputs
      const searchInput = document.getElementById('searchInput');
      const clearSearchBtn = document.getElementById('clearSearchBtn');

      searchInput.addEventListener('input', () => {
        if (searchInput.value.trim().length > 0) {
          clearSearchBtn.classList.remove('hidden');
        } else {
          clearSearchBtn.classList.add('hidden');
        }
        applyFilters();
      });

      clearSearchBtn.addEventListener('click', () => {
        searchInput.value = '';
        clearSearchBtn.classList.add('hidden');
        applyFilters();
      });

      // Filter Selects
      document.getElementById('countyFilter').addEventListener('change', applyFilters);
      document.getElementById('routeFilter').addEventListener('change', applyFilters);
      document.getElementById('directionFilter').addEventListener('change', applyFilters);

      // Reset
      document.getElementById('resetFiltersBtn').addEventListener('click', () => {
        document.getElementById('searchInput').value = '';
        document.getElementById('countyFilter').value = '';
        document.getElementById('routeFilter').value = '';
        document.getElementById('directionFilter').value = '';
        document.getElementById('clearSearchBtn').classList.add('hidden');
        state.selectedItemIndex = null;
        applyFilters();
      });

      // Map Quick Tools
      document.getElementById('fitAllBtn').addEventListener('click', () => {
        if (state.markerClusterGroup.getLayers().length > 0) {
          state.map.fitBounds(state.markerClusterGroup.getBounds().pad(0.08));
        } else {
          state.map.setView([23.9738, 120.9820], 8);
        }
      });

      document.getElementById('locateMeBtn').addEventListener('click', () => {
        if (!navigator.geolocation) {
          alert('您的瀏覽器不支援定位功能。');
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const userLat = pos.coords.latitude;
            const userLng = pos.coords.longitude;
            state.map.flyTo([userLat, userLng], 14);

            L.circleMarker([userLat, userLng], {
              radius: 9,
              color: '#ffffff',
              weight: 3,
              fillColor: '#2563eb',
              fillOpacity: 1
            }).addTo(state.map).bindPopup('您的目前位置').openPopup();
          },
          (err) => {
            alert('無法取得定位：' + err.message);
          }
        );
      });
    }

    // App Bootstrapping
    window.addEventListener('DOMContentLoaded', () => {
      initMap();
      setupEventListeners();
      processRawDataset(DEFAULT_ROAD_RECORDS);
    });
  </script>
</body>
</html>
