<body class="bg-slate-900 text-slate-800 h-screen w-screen overflow-hidden flex flex-col">

  <header class="bg-slate-900 border-b border-slate-800 text-white px-4 py-3 flex items-center justify-between shrink-0 shadow-md z-30">
    <div class="flex items-center space-x-3">
      <div class="bg-sky-500/10 text-sky-400 p-2.5 rounded-xl border border-sky-500/20 flex items-center justify-center">
        <i class="fa-solid fa-camera text-xl"></i>
      </div>
      <div>
        <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
          省道測速取締圖資互動地圖
          <span class="text-xs font-medium px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">警52標誌圖資</span>
        </h1>
        <p class="text-xs text-slate-400">交通部公路局官方規格 · 資料原始忠實呈現 · 全台點位聚合查詢</p>
      </div>
    </div>

    <div class="flex items-center space-x-2">
      <!-- File upload trigger for user's own CSV -->
      <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-medium py-1.5 px-3 rounded-lg flex items-center gap-2 transition duration-150">
        <i class="fa-solid fa-file-arrow-up text-sky-400"></i>
        <span>載入自有 CSV 檔</span>
        <input type="file" id="csvFileInput" accept=".csv" class="hidden" />
      </label>

      <!-- Toggle sidebar button for mobile/desktop -->
      <button id="toggleSidebarBtn" class="bg-sky-600 hover:bg-sky-500 text-white text-xs font-semibold py-1.5 px-3 rounded-lg flex items-center gap-1.5 transition duration-150 shadow-sm">
        <i class="fa-solid fa-bars-staggered"></i>
        <span class="hidden sm:inline">側邊欄</span>
      </button>
    </div>
  </header>

  <div class="relative flex-1 flex overflow-hidden">
    
    <!-- LEFT PANEL: Filter, Search & List View -->
    <aside id="sidebar" class="w-full sm:w-96 md:w-[420px] bg-slate-50 border-r border-slate-200 flex flex-col shrink-0 z-20 transition-all duration-300 ease-in-out absolute md:relative h-full shadow-2xl md:shadow-none">
      
      <!-- Top Filters Container -->
      <div class="p-4 bg-white border-b border-slate-200 space-y-3">
        <!-- Search input -->
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input
            type="text"
            id="searchInput"
            placeholder="搜尋公路 (台1)、縣市、鄉鎮、樁號..."
            class="w-full pl-9 pr-9 py-2 text-sm bg-slate-100 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500 focus:bg-white transition"
          />
          <button id="clearSearchBtn" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
            <i class="fa-solid fa-circle-xmark"></i>
          </button>
        </div>

        <!-- Filter Dropdowns Grid -->
        <div class="grid grid-cols-2 gap-2 text-xs">
          <div>
            <label class="block text-slate-500 font-medium mb-1">隸屬縣市</label>
            <select id="countyFilter" class="w-full bg-slate-100 border border-slate-200 rounded-lg p-2 focus:ring-1 focus:ring-sky-500 focus:outline-none text-slate-700">
              <option value="">全部縣市</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-500 font-medium mb-1">公路編號</label>
            <select id="routeFilter" class="w-full bg-slate-100 border border-slate-200 rounded-lg p-2 focus:ring-1 focus:ring-sky-500 focus:outline-none text-slate-700">
              <option value="">全部路線</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2 text-xs">
          <div>
            <label class="block text-slate-500 font-medium mb-1">牌面方向</label>
            <select id="directionFilter" class="w-full bg-slate-100 border border-slate-200 rounded-lg p-2 focus:ring-1 focus:ring-sky-500 focus:outline-none text-slate-700">
              <option value="">全方向</option>
              <option value="順">順向</option>
              <option value="逆">逆向</option>
              <option value="雙">雙向</option>
            </select>
          </div>
          <div class="flex items-end">
            <button id="resetFiltersBtn" class="w-full py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg font-medium transition flex items-center justify-center gap-1.5">
              <i class="fa-solid fa-rotate-left"></i>
              <span>重設篩選</span>
            </button>
          </div>
        </div>

        <!-- Meta statistics indicator -->
        <div class="flex items-center justify-between text-xs pt-1 text-slate-500">
          <div>
            顯示 <span id="filteredCount" class="font-bold text-sky-600">0</span> / 總計 <span id="totalCount" class="font-medium text-slate-700">0</span> 筆取締點
          </div>
          <div id="dataStatusIndicator" class="flex items-center gap-1.5 text-emerald-600 font-medium">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span>圖資已載入</span>
          </div>
        </div>
      </div>

      <div id="cardsContainer" class="flex-1 overflow-y-auto p-3 space-y-2.5">
        <!-- Cards will be populated dynamically -->
      </div>
      
      <!-- Footer Note -->
      <div class="p-2.5 bg-slate-100 border-t border-slate-200 text-[11px] text-slate-500 text-center">

        </button>

          <p id="loadingMessage" class="text-sm font-semibold tracking-wide">資料載入與座標解析中...</p>

      </div>
    </main>

    /* Helper: coordinate extractor across varied official header conventions */
    function extractCoordinates(row) {
      let lat = null;
      let lng = null;

      // 1. Direct WGS84 keys commonly used by DGOH
      if (row['坐標-N-WGS84'] && row['坐標-E-WGS84']) {
        lat = parseFloat(row['坐標-N-WGS84']);
        lng = parseFloat(row['坐標-E-WGS84']);
      } else if (row['緯度'] && row['經度']) {
        lat = parseFloat(row['緯度']);
        lng = parseFloat(row['經度']);
      } else if (row['Lat'] && row['Lng']) {
        lat = parseFloat(row['Lat']);
        lng = parseFloat(row['Lng']);
      } else if (row['WGS84_N'] && row['WGS84_E']) {
        lat = parseFloat(row['WGS84_N']);
        lng = parseFloat(row['WGS84_E']);
      } else {
        // Fallback search through keys
        for (let k in row) {
          const lower = k.toLowerCase();
          if (lower.includes('wgs84') || lower.includes('坐標') || lower.includes('lat') || lower.includes('經緯度')) {
            if ((k.includes('N') || lower.includes('lat') || k.includes('緯')) && !lat) {
              const val = parseFloat(row[k]);
              if (!isNaN(val)) lat = val;
            }
            if ((k.includes('E') || lower.includes('lng') || lower.includes('lon') || k.includes('經')) && !lng) {
              const val = parseFloat(row[k]);
              if (!isNaN(val)) lng = val;
            }
          }
        }
      }

      // Taiwan bounding sanity test: Lat 21~26, Lng 118~123
      if (lat && lng && !isNaN(lat) && !isNaN(lng)) {
        // Swap test if inverted
        if (lat > 118 && lat < 123 && lng > 21 && lng < 26) {
          const temp = lat;
          lat = lng;
          lng = temp;
        }
        if (lat >= 21.0 && lat <= 26.5 && lng >= 118.0 && lng <= 123.0) {
          return { lat, lng, valid: true };
        }
      }
      return { lat, lng, valid: false };
    }

    function initMap() {
      // Taiwan center point
      state.map = L.map('map', {
        zoomControl: false,
        attributionControl: false
      }).setView([23.973875, 120.982024], 8);

      // Clean, high readability CartoDB Voyager tiles
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        maxZoom: 19,
        subdomains: 'abcd',
        attribution: '&copy; OpenStreetMap &copy; CARTO'
      }).addTo(state.map);

      // Re-add zoom control to bottom right to keep UI tidy
      L.control.zoom({ position: 'bottomright' }).addTo(state.map);

      // Attribution on bottom-right
      L.control.attribution({ position: 'bottomright' }).addTo(state.map);

      // Setup Marker Cluster Group
      state.markerClusterGroup = L.markerClusterGroup({
        chunkedLoading: true,
        maxClusterRadius: 45,
        spiderfyOnMaxZoom: true,
        showCoverageOnHover: false,
        zoomToBoundsOnClick: true
      });
      state.map.addLayer(state.markerClusterGroup);
    }

    function buildPopupHtml(item, index) {
      // Build an elegant table that renders ALL original attributes faithfully
      let rowsHtml = '';
      
      const prioritizedKeys = [
        '公路編號', '起點樁號', '牌面方向', '牌面內容', 
        '隸屬縣市', '隸屬鄉鎮', '隸屬村里', '管養工務段', 
        '管養單位', '性質', '現況', '調查日期', '備註'
      ];
      
      const processedKeys = new Set();

      // Render prominent keys first
      prioritizedKeys.forEach(key => {
        if (item[key] !== undefined && item[key] !== null && String(item[key]).trim() !== '') {
          rowsHtml += `
            <tr class="border-b border-slate-100">
              <td class="py-1 px-2.5 text-[11px] font-semibold text-slate-500 bg-slate-50 whitespace-nowrap">${key}</td>
              <td class="py-1 px-2.5 text-[11px] text-slate-800 break-words">${item[key]}</td>
            </tr>
          `;
          processedKeys.add(key);
        }
      });

      // Render all other remaining keys strictly without dropping or altering anything
      Object.keys(item).forEach(key => {
        if (!processedKeys.has(key) && key !== '_internal_id' && key !== '_coords') {
          rowsHtml += `
            <tr class="border-b border-slate-100">
              <td class="py-1 px-2.5 text-[11px] font-medium text-slate-400 bg-slate-50/70 whitespace-nowrap">${key}</td>
              <td class="py-1 px-2.5 text-[11px] text-slate-700 break-words">${item[key] !== undefined ? item[key] : ''}</td>
            </tr>
          `;
        }
      });

      const roadName = item['公路編號'] || item['路線'] || '省道';
      const mile = item['起點樁號'] || item['樁號'] || '';
      const county = item['隸屬縣市'] || '';
      const town = item['隸屬鄉鎮'] || '';

      return `
        <div class="text-slate-800 bg-white">
          <div class="bg-gradient-to-r from-sky-700 to-sky-900 text-white p-3.5">
            <div class="flex items-center justify-between">
              <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-bold bg-amber-400 text-slate-900">
                <i class="fa-solid fa-triangle-exclamation mr-1"></i> ${roadName}
              </span>
              <span class="text-xs text-sky-200 font-mono">${mile}</span>
            </div>
            <h4 class="font-bold text-sm mt-1.5">${county} ${town} 取締點標誌</h4>
          </div>
          
          <div class="max-h-60 overflow-y-auto">
            <table class="w-full text-left border-collapse">
              <tbody>
                ${rowsHtml}
              </tbody>
            </table>
          </div>

          <div class="p-2.5 bg-slate-50 border-t border-slate-100 flex items-center justify-between text-[11px]">
            <span class="text-slate-400 font-mono">ID: #${index + 1}</span>
            <button onclick="zoomToRecord(${item._internal_id})" class="text-sky-600 hover:text-sky-800 font-semibold flex items-center gap-1">
              <i class="fa-solid fa-crosshairs"></i> 聚焦置中
            </button>
          </div>
        </div>
      `;
    }

    function renderMarkers() {
      state.markerClusterGroup.clearLayers();
      state.markerMap.clear();

      state.filteredRecords.forEach((item) => {
        if (!item._coords || !item._coords.valid) return;

        // Custom camera pin icon
        const icon = L.divIcon({
          className: 'custom-div-icon',
          html: `<div class="custom-camera-pin w-8 h-8"><i class="fa-solid fa-camera text-xs"></i></div>`,
          iconSize: [32, 32],
          iconAnchor: [16, 16],
          popupAnchor: [0, -18]
        });

        const marker = L.marker([item._coords.lat, item._coords.lng], { icon: icon });
        const popupContent = buildPopupHtml(item, item._internal_id);
        marker.bindPopup(popupContent, { maxWidth: 360 });

        state.markerMap.set(item._internal_id, marker);
        state.markerClusterGroup.addLayer(marker);
      });
    }

    function renderCards() {
      const container = document.getElementById('cardsContainer');
      const filteredCountEl = document.getElementById('filteredCount');
      filteredCountEl.innerText = state.filteredRecords.length.toLocaleString();

      if (state.filteredRecords.length === 0) {
        container.innerHTML = `
          <div class="h-64 flex flex-col items-center justify-center text-slate-400 text-center p-6">
            <i class="fa-solid fa-folder-open text-4xl mb-3 text-slate-300"></i>
            <p class="font-medium text-sm">查無符合條件的測速取締點</p>
            <p class="text-xs mt-1 text-slate-400">請嘗試清除關鍵字或變更篩選選項</p>
          </div>
        `;
        return;
      }

      // Limit initial DOM card rendering to first 150 items for instant responsiveness if dataset is huge
      const displayBatch = state.filteredRecords.slice(0, 150);

      let cardsHtml = '';
      displayBatch.forEach((item) => {
        const id = item._internal_id;
        const road = item['公路編號'] || '省道';
        const mile = item['起點樁號'] || '';
        const county = item['隸屬縣市'] || '';
        const town = item['隸屬鄉鎮'] || '';
        const direction = item['牌面方向'] || '未標註';
        const isSelected = state.selectedItemIndex === id;

        cardsHtml += `
          <div onclick="selectAndFocus(${id})" 
               class="bg-white rounded-xl p-3 border transition duration-150 cursor-pointer shadow-sm hover:border-sky-500 hover:shadow-md ${
                 isSelected ? 'border-sky-500 ring-2 ring-sky-500/20 bg-sky-50/30' : 'border-slate-200'
               }">
            <div class="flex items-center justify-between mb-1.5">
              <span class="px-2 py-0.5 rounded font-bold text-xs bg-slate-900 text-amber-400">
                ${road}
              </span>
              <span class="text-xs font-semibold text-sky-700 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">
                ${mile || '樁號未載'}
              </span>
            </div>

            <div class="text-sm font-bold text-slate-800 flex items-center gap-1.5">
              <i class="fa-solid fa-location-dot text-rose-500 text-xs"></i>
              <span>${county} ${town}</span>
              ${item['隸屬村里'] ? `<span class="text-slate-400 font-normal text-xs">(${item['隸屬村里']})</span>` : ''}
            </div>

            <div class="mt-2 text-xs text-slate-500 flex flex-wrap gap-x-3 gap-y-1">
              <div><span class="text-slate-400">方向:</span> <span class="text-slate-700 font-medium">${direction}</span></div>
              ${item['管養工務段'] ? `<div><span class="text-slate-400">工務段:</span> ${item['管養工務段']}</div>` : ''}
            </div>

            ${item['牌面內容'] ? `
              <div class="mt-2 pt-1.5 border-t border-slate-100 text-[11px] text-slate-500 truncate">
                <i class="fa-solid fa-circle-info text-sky-400 mr-1"></i>${item['牌面內容']}
              </div>
            ` : ''}
          </div>
        `;
      });

      if (state.filteredRecords.length > 150) {
        cardsHtml += `
          <div class="text-center py-2 text-xs text-slate-400 bg-slate-100 rounded-lg">
            已顯示前 150 筆清單（地圖已呈現全部 ${state.filteredRecords.length} 筆點位）
          </div>
        `;
      }

      container.innerHTML = cardsHtml;
    }

    window.selectAndFocus = function(internalId) {
      state.selectedItemIndex = internalId;
      renderCards(); // update highlight state
      zoomToRecord(internalId);
      
      // Auto close sidebar on narrow screens
      if (window.innerWidth < 768) {
        toggleSidebar(false);
      }
    };

    window.zoomToRecord = function(internalId) {
      const marker = state.markerMap.get(internalId);
      if (!marker) return;

      const latlng = marker.getLatLng();

      // Leaflet markercluster smart zoom to uncluster & open popup
      state.markerClusterGroup.zoomToShowLayer(marker, () => {
        state.map.flyTo(latlng, 16, { animate: true, duration: 1.0 });
        marker.openPopup();
      });
    };

    function applyFilters() {
      const searchKeyword = document.getElementById('searchInput').value.trim().toLowerCase();
      const county = document.getElementById('countyFilter').value;
      const route = document.getElementById('routeFilter').value;
      const direction = document.getElementById('directionFilter').value;

      state.filteredRecords = state.allRecords.filter((item) => {
        // County filter
        if (county && item['隸屬縣市'] !== county) return false;

        // Route filter
        if (route && item['公路編號'] !== route) return false;

        // Direction filter
        if (direction) {
          const dirStr = String(item['牌面方向'] || '');
          if (!dirStr.includes(direction)) return false;
        }

        // Search text matching across multiple values
        if (searchKeyword) {
          const searchTargets = [
            item['公路編號'],
            item['起點樁號'],
            item['隸屬縣市'],
            item['隸屬鄉鎮'],
            item['隸屬村里'],
            item['編號'],
            item['管養工務段'],
            item['管養單位'],
            item['牌面內容'],
            item['備註']
          ].filter(Boolean).map(v => String(v).toLowerCase());

          const match = searchTargets.some(val => val.includes(searchKeyword));
          if (!match) return false;
        }

        return true;
      });

      renderMarkers();
      renderCards();
    }

    function populateFilterDropdowns() {
      const countySelect = document.getElementById('countyFilter');
      const routeSelect = document.getElementById('routeFilter');

      const counties = new Set();
      const routes = new Set();

      state.allRecords.forEach(item => {
        if (item['隸屬縣市']) counties.add(item['隸屬縣市'].trim());
        if (item['公路編號']) routes.add(item['公路編號'].trim());
      });

      // Counties sorted
      const sortedCounties = Array.from(counties).sort((a, b) => a.localeCompare(b, 'zh-Hant'));
      countySelect.innerHTML = '<option value="">全部縣市</option>';
      sortedCounties.forEach(c => {
        countySelect.innerHTML += `<option value="${c}">${c}</option>`;
      });

      // Routes sorted (natural sort)
      const sortedRoutes = Array.from(routes).sort((a, b) => a.localeCompare(b, 'zh-Hant', { numeric: true }));
      routeSelect.innerHTML = '<option value="">全部路線</option>';
      sortedRoutes.forEach(r => {
        routeSelect.innerHTML += `<option value="${r}">${r}</option>`;
      });
    }

    function processRawDataset(records) {
      showLoading('解析官方圖資點位與空間坐標...');
      
      let processed = [];
      records.forEach((row, idx) => {
        // Skip empty lines
        if (Object.keys(row).length === 0 || (Object.keys(row).length === 1 && !Object.values(row)[0])) {
          return;
        }
        
        const coords = extractCoordinates(row);
        processed.push({
          ...row,
          _internal_id: idx,
          _coords: coords
        });
      });

      state.allRecords = processed;
      state.filteredRecords = [...processed];

      document.getElementById('totalCount').innerText = processed.length.toLocaleString();

      populateFilterDropdowns();
      renderMarkers();
      renderCards();

      // Fit map boundary to markers if available
      if (state.markerClusterGroup.getLayers().length > 0) {
        state.map.fitBounds(state.markerClusterGroup.getBounds().pad(0.08));
      }

      hideLoading();
    }

    function handleCsvFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;

      showLoading('讀取上傳之 CSV 圖資...');

      Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        encoding: 'UTF-8',
        complete: function(results) {
          if (results.data && results.data.length > 0) {
            processRawDataset(results.data);
            const statusIndicator = document.getElementById('dataStatusIndicator');
            statusIndicator.innerHTML = `
              <span class="w-2 h-2 rounded-full bg-sky-500 animate-ping"></span>
              <span class="text-sky-600 font-medium">已載入自有檔案 (${file.name})</span>
            `;
          } else {
            alert('CSV 解析失敗或檔案為空，請確認檔案格式。');
            hideLoading();
          }
        },
        error: function(err) {
          console.error('CSV Parsing Error:', err);
          alert('CSV 解析發生錯誤：' + err.message);
          hideLoading();
        }
      });
    }

    function toggleSidebar(forceState) {
      const sidebar = document.getElementById('sidebar');
      if (typeof forceState === 'boolean') {
        state.sidebarOpen = forceState;
      } else {
        state.sidebarOpen = !state.sidebarOpen;
      }

      if (state.sidebarOpen) {
        sidebar.classList.remove('-translate-x-full');
      } else {
        sidebar.classList.add('-translate-x-full');
      }
      setTimeout(() => {
        state.map.invalidateSize();
      }, 310);
    }

    function setupEventListeners() {
      // File upload
      document.getElementById('csvFileInput').addEventListener('change', handleCsvFileSelect);

      // Sidebar Toggle
      document.getElementById('toggleSidebarBtn').addEventListener('click', () => toggleSidebar());

      // Search and Filter events
      const searchInput = document.getElementById('searchInput');
      const clearSearchBtn = document.getElementById('clearSearchBtn');

      searchInput.addEventListener('input', () => {
        if (searchInput.value.trim().length > 0) {
          clearSearchBtn.classList.remove('hidden');
        } else {
          clearSearchBtn.classList.add('hidden');
        }
        applyFilters();
      });

      clearSearchBtn.addEventListener('click', () => {
        searchInput.value = '';
        clearSearchBtn.classList.add('hidden');
        applyFilters();
      });

      document.getElementById('countyFilter').addEventListener('change', applyFilters);
      document.getElementById('routeFilter').addEventListener('change', applyFilters);
      document.getElementById('directionFilter').addEventListener('change', applyFilters);

      // Reset filters button
      document.getElementById('resetFiltersBtn').addEventListener('click', () => {
        document.getElementById('searchInput').value = '';
        document.getElementById('countyFilter').value = '';
        document.getElementById('routeFilter').value = '';
        document.getElementById('directionFilter').value = '';
        document.getElementById('clearSearchBtn').classList.add('hidden');
        state.selectedItemIndex = null;
        applyFilters();
      });

      // Quick map buttons
      document.getElementById('fitAllBtn').addEventListener('click', () => {
        if (state.markerClusterGroup.getLayers().length > 0) {
          state.map.fitBounds(state.markerClusterGroup.getBounds().pad(0.08));
        } else {
          state.map.setView([23.973875, 120.982024], 8);
        }
      });

      document.getElementById('locateMeBtn').addEventListener('click', () => {
        if (!navigator.geolocation) {
          alert('您的瀏覽器不支援定位功能');
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const userLat = pos.coords.latitude;
            const userLng = pos.coords.longitude;
            state.map.flyTo([userLat, userLng], 14);

            L.circleMarker([userLat, userLng], {
              radius: 9,
              color: '#ffffff',
              weight: 3,
              fillColor: '#0284c7',
              fillOpacity: 1
            }).addTo(state.map).bindPopup('您的目前位置').openPopup();
          },
          (err) => {
            console.warn('Geolocation Error:', err);
            alert('無法獲取定位位置：' + err.message);
          }
        );
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      initMap();
      setupEventListeners();
      // Load default Ministry of Transportation and Communications (THB) dataset
      processRawDataset(DEFAULT_ROAD_RECORDS);
    });
  </script>
</body>
</html>
